name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint, Test & Concurrency Gate
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotel_db
          POSTGRES_USER: hotel_user
          POSTGRES_PASSWORD: local_dev_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: local_dev_password_123
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint Code with Ruff
        run: |
          ruff check .

      - name: Verify Code Formatting with Black
        run: |
          black --check .

      - name: Apply Database Migrations (Alembic)
        run: |
          alembic upgrade head

      - name: Run Pytest Suite & Concurrency Gate
        run: |
          pytest -v -s

  docker-build:
    name: Build & Tag Container Image
    runs-on: ubuntu-24.04
    needs: lint-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/drax102/devops_hotel_assignment
          tags: |
            type=sha,format=long,prefix=sha-
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Package Container Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Verify Built Local Container Image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          docker images ghcr.io/drax102/devops_hotel_assignment

      - name: Record Image Digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "Pushed Image Digest: ${{ steps.build.outputs.digest }}"
